<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>M5Engine — MLX Local Inference</title>
<style>
  :root {
    --bg-base:#0b0d12; --bg-panel:#12161f; --bg-card:#181d29; --bg-input:#0e121a; --border:#262e40;
    --text-main:#eef2f8; --text-muted:#8c98b0; --accent:#3b82f6; --green:#10b981; --purple:#8b5cf6;
    --amber:#f59e0b; --red:#ef4444;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;
    --mono:"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); background:var(--bg-base); color:var(--text-main); height:100vh; display:flex; overflow:hidden; font-size:13px; }
  .sidebar { width:390px; background:var(--bg-panel); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:16px; gap:14px; overflow-y:auto; }
  .brand { display:flex; align-items:center; justify-content:space-between; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .brand-title { font-size:18px; font-weight:700; }
  .badge { font-size:11px; font-family:var(--mono); padding:3px 8px; border-radius:999px; font-weight:600; border:1px solid var(--border); color:var(--text-muted); }
  .badge.ready { color:var(--green); border-color:rgba(16,185,129,.4); background:rgba(16,185,129,.12); }
  .badge.loading { color:var(--amber); border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.12); }
  .badge.error { color:var(--red); border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.12); }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .section-title { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-muted); font-weight:600; }
  label { font-size:11px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px; }
  input, select, textarea { background:var(--bg-input); color:var(--text-main); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font-family:inherit; font-size:12px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { background:var(--accent); color:white; border:0; border-radius:6px; padding:7px 10px; font-weight:600; cursor:pointer; font-size:12px; }
  button.secondary { background:transparent; border:1px solid var(--border); color:var(--text-main); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-family:var(--mono); font-size:11.5px; }
  .kv span:nth-child(odd) { color:var(--text-muted); }
  .kv span:nth-child(even) { text-align:right; }
  .big { font-size:26px; font-weight:700; font-family:var(--mono); }
  .muted { color:var(--text-muted); font-size:11px; }
  .bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--bg-input); border:1px solid var(--border); }
  .bar div { height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; font-size:10.5px; color:var(--text-muted); }
  .legend i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { padding:10px 18px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .metric { display:flex; flex-direction:column; }
  .metric b { font-family:var(--mono); font-size:15px; }
  .metric span { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.6px; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:860px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; line-height:1.5; }
  .msg.user { align-self:flex-end; background:rgba(59,130,246,.18); border:1px solid rgba(59,130,246,.35); }
  .msg.assistant { align-self:flex-start; background:var(--bg-card); border:1px solid var(--border); }
  .msg.system-note { align-self:center; color:var(--text-muted); font-size:11px; }
  .composer { border-top:1px solid var(--border); padding:12px 18px; display:flex; flex-direction:column; gap:8px; }
  .composer-opts { display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:11px; color:var(--text-muted); }
  .composer-opts input[type=number] { width:80px; }
  .composer-row { display:flex; gap:8px; }
  .composer-row textarea { flex:1; resize:none; height:62px; font-size:13px; }
  .reco { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 0; border-bottom:1px dashed var(--border); font-size:11px; }
  .reco:last-child { border-bottom:0; }
  .reco .name { font-family:var(--mono); font-size:10.5px; word-break:break-all; }
  .pill { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--border); color:var(--text-muted); white-space:nowrap; }
  .pill.fit { color:var(--green); } .pill.stream { color:var(--purple); } .pill.no { color:var(--red); }
  .err { color:var(--red); font-size:11px; white-space:pre-wrap; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="brand-title">M5Engine <span class="muted">MLX</span></div>
    <span id="state" class="badge">empty</span>
  </div>

  <div class="card">
    <div class="section-title">Hardware</div>
    <div class="kv" id="hw"></div>
  </div>

  <div class="card">
    <div class="section-title">Load model</div>
    <label>Model (local path or Hugging Face repo id)
      <input id="model" list="local-models" placeholder="mlx-community/Qwen3-30B-A3B-Instruct-2507-4bit" />
      <datalist id="local-models"></datalist>
    </label>
    <div class="row">
      <label>KV cache
        <select id="kv_bits"><option value="8" selected>8-bit</option><option value="4">4-bit (max context)</option><option value="0">fp16</option></select>
      </label>
      <label>Long context (YaRN)
        <select id="rope_scaling"><option value="auto" selected>auto</option><option value="off">off</option><option value="2">force 2x</option><option value="4">force 4x</option></select>
      </label>
    </div>
    <div class="row">
      <label>Max context (blank = largest)<input id="max_context" type="number" min="512" step="256" /></label>
      <label>Memory budget GB (blank = auto)<input id="memory_budget_gb" type="number" step="1" /></label>
    </div>
    <div class="row">
      <label>Expert streaming
        <select id="stream_experts"><option value="auto" selected>auto</option><option value="on">on</option><option value="off">off</option></select>
      </label>
      <label>Expert cache GB (blank = auto)<input id="expert_cache_gb" type="number" step="1" /></label>
    </div>
    <label>Draft model for speculative decoding (optional)<input id="draft_model" list="local-models" placeholder="mlx-community/Qwen3-0.6B-4bit" /></label>
    <div class="row">
      <button id="btn-load">Load</button>
      <button id="btn-unload" class="secondary">Unload</button>
    </div>
    <div id="load-error" class="err"></div>
  </div>

  <div class="card">
    <div class="section-title">Context window</div>
    <div><span class="big" id="ctx-max">—</span> <span class="muted">tokens max</span></div>
    <div class="muted" id="ctx-why"></div>
    <div class="bar" id="mem-bar"></div>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>weights</span>
      <span><i style="background:var(--purple)"></i>expert cache</span>
      <span><i style="background:var(--green)"></i>KV cache</span>
      <span><i style="background:var(--amber)"></i>reserve</span>
    </div>
    <div class="kv" id="ctx"></div>
  </div>

  <div class="card" id="stream-card" style="display:none">
    <div class="section-title">Expert streaming (SSD)</div>
    <div class="kv" id="stream"></div>
  </div>

  <div class="card">
    <div class="section-title">Recommended models</div>
    <div id="recos" class="muted">Loading…</div>
    <div id="downloads" class="kv"></div>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="metric"><b id="m-model">—</b><span>model</span></div>
    <div class="metric"><b id="m-ttft">—</b><span>TTFT</span></div>
    <div class="metric"><b id="m-ptps">—</b><span>prefill tok/s</span></div>
    <div class="metric"><b id="m-dtps">—</b><span>decode tok/s</span></div>
    <div class="metric"><b id="m-cached">—</b><span>prefix-cached</span></div>
    <div class="metric"><b id="m-draft">—</b><span>draft accepted</span></div>
    <div class="metric"><b id="m-peak">—</b><span>peak GB</span></div>
    <div class="metric"><b id="m-thermal">—</b><span>thermal</span></div>
  </div>
  <div id="chat"></div>
  <div class="composer">
    <div class="composer-opts">
      <label style="flex-direction:row;align-items:center">Max tokens <input id="max_tokens" type="number" value="1024" min="1" /></label>
      <label style="flex-direction:row;align-items:center">Temperature <input id="temperature" type="number" value="0.7" step="0.1" min="0" /></label>
      <label style="flex-direction:row;align-items:center"><input id="thinking" type="checkbox" checked /> thinking</label>
      <label style="flex-direction:row;align-items:center"><input id="prefix_cache" type="checkbox" checked /> prefix cache</label>
      <label style="flex-direction:row;align-items:center"><input id="speculative" type="checkbox" checked /> speculative</label>
      <button id="btn-clear" class="secondary">New chat</button>
    </div>
    <div class="composer-row">
      <textarea id="prompt" placeholder="Message (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="btn-send">Send</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n == null ? '—' : Number(n).toLocaleString();
const gb = n => n == null ? '—' : `${Number(n).toFixed(1)} GB`;
let history = [];
let busy = false;
let localError = '';

function kv(el, pairs) {
  el.innerHTML = pairs.filter(p => p[1] !== undefined).map(([k, v]) => `<span>${k}</span><span>${v ?? '—'}</span>`).join('');
}

async function refresh() {
  let s;
  try { s = await (await fetch('/v1/engine/stats')).json(); } catch { return; }
  const st = $('state'); st.textContent = s.state; st.className = 'badge ' + s.state;
  $('btn-load').disabled = s.state === 'loading';
  $('load-error').textContent = localError || (s.state === 'error' ? s.error : '');
  const h = s.hardware;
  kv($('hw'), [['chip', h.chip], ['gpu', h.metal ? h.gpu : 'CPU (no Metal)'], ['unified memory', gb(h.total_ram_gb)],
    ['GPU budget', gb(h.gpu_limit_gb)], ['active / peak', `${gb(s.memory.active_gb)} / ${gb(s.memory.peak_gb)}`], ['MLX', h.mlx_version]]);
  $('m-thermal').textContent = h.thermal;
  if (!s.model) {
    $('m-model').textContent = '—'; $('ctx-max').textContent = '—'; $('ctx-why').textContent = 'No model loaded';
    $('ctx').innerHTML = ''; $('mem-bar').innerHTML = ''; $('stream-card').style.display = 'none';
    return;
  }
  $('m-model').textContent = s.model.id.split('/').pop();
  const c = s.context;
  $('ctx-max').textContent = fmt(c.max_context);
  const why = { memory: 'limited by memory', model: 'limited by the model\'s position limit', setting: 'limited by your setting' }[c.limited_by];
  $('ctx-why').textContent = `${why}${c.yarn_factor > 1 ? ` · YaRN up to ${c.yarn_factor}x (active: ${c.current_yarn_factor}x)` : ''}`;
  const total = c.budget_gb, seg = (v, col) => `<div style="width:${Math.max(0, v / total * 100)}%;background:${col}"></div>`;
  $('mem-bar').innerHTML = seg(c.resident_weight_gb, 'var(--accent)') + seg(c.expert_cache_gb, 'var(--purple)') +
    seg(c.kv_budget_gb, 'var(--green)') + seg(c.reserve_gb, 'var(--amber)');
  kv($('ctx'), [['native window', fmt(c.native_context)], ['model limit', fmt(c.model_context_limit)],
    ['memory limit', fmt(c.memory_context_limit)], ['KV precision', c.kv_bits ? `${c.kv_bits}-bit` : 'fp16'],
    ['KV per token', `${(c.kv_bytes_per_token / 1024).toFixed(1)} KB`], ['KV budget', gb(c.kv_budget_gb)],
    ['weights resident', gb(c.resident_weight_gb)], ['prefix cache', `${s.prefix_cache.entries} conv · ${gb(s.prefix_cache.gb)}`]]);
  const es = s.expert_streaming;
  $('stream-card').style.display = es ? '' : 'none';
  if (es) kv($('stream'), [['experts on disk', gb(es.total_expert_gb)], ['cache', `${gb(es.cache_used_gb)} / ${gb(es.cache_capacity_gb)}`],
    ['cache slots', `${fmt(es.cache_slots)} × ${es.expert_mb} MB`], ['hit rate', `${(es.hit_rate * 100).toFixed(1)}%`],
    ['prefetch used / issued', `${fmt(es.prefetch_used)} / ${fmt(es.prefetch_issued)}`], ['read', `${es.gb_read} GB @ ${es.read_gb_per_s} GB/s`]]);
  const m = s.last_request;
  if (m && m.prompt_tokens) {
    $('m-ttft').textContent = `${Math.round(m.ttft_ms)} ms`; $('m-ptps').textContent = m.prompt_tps.toFixed(1);
    $('m-dtps').textContent = m.decode_tps.toFixed(1); $('m-cached').textContent = `${fmt(m.cached_tokens)}/${fmt(m.prompt_tokens)}`;
    $('m-draft').textContent = fmt(m.draft_accepted); $('m-peak').textContent = m.peak_memory_gb;
  }
}

async function refreshModels() {
  try {
    const local = await (await fetch('/v1/models/local')).json();
    $('local-models').innerHTML = local.data.map(m => `<option value="${m.id}">${m.size_gb} GB${m.moe ? ' · MoE' : ''}</option>`).join('');
    const r = await (await fetch('/v1/models/recommendations')).json();
    $('recos').innerHTML = `<div class="muted">GPU budget ${r.budget_gb} GB</div>` + r.data.map(m => {
      const cls = m.fit.startsWith('fits') ? 'fit' : m.fit.startsWith('streams') ? 'stream' : m.fit.startsWith('too') ? 'no' : '';
      return `<div class="reco"><div><div class="name">${m.repo_id}</div><div>${m.kind} · ${m.params_b}B${m.kind === 'moe' ? ` (${m.active_b}B active)` : ''} · ${m.size_gb} GB</div></div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="pill ${cls}">${m.fit}</span>
        <button class="secondary" data-repo="${m.repo_id}" ${cls === 'no' ? 'disabled' : ''}>Download</button></div></div>`;
    }).join('');
    $('recos').querySelectorAll('button[data-repo]').forEach(b => b.onclick = () => download(b.dataset.repo));
  } catch (e) { $('recos').textContent = 'Could not load recommendations'; }
}

async function refreshDownloads() {
  const d = await (await fetch('/v1/models/download/status')).json();
  kv($('downloads'), d.data.map(j => [j.repo_id.split('/').pop(),
    j.state === 'downloading' ? `${j.downloaded_gb}${j.total_gb ? ' / ' + j.total_gb : ''} GB` : j.state === 'error' ? 'error: ' + j.error : j.state]));
  if (d.data.some(j => j.state === 'downloading')) setTimeout(refreshDownloads, 1500); else refreshModels();
}

async function download(repo) {
  await fetch('/v1/models/download', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo_id: repo }) });
  refreshDownloads();
}

$('btn-load').onclick = async () => {
  const body = { model: $('model').value.trim() };
  if (!body.model) { localError = 'Enter a model'; $('load-error').textContent = localError; return; }
  localError = '';
  body.kv_bits = Number($('kv_bits').value);
  body.rope_scaling = $('rope_scaling').value;
  body.stream_experts = $('stream_experts').value;
  for (const k of ['max_context', 'memory_budget_gb', 'expert_cache_gb']) if ($(k).value) body[k] = Number($(k).value);
  if ($('draft_model').value.trim()) body.draft_model = $('draft_model').value.trim();
  const r = await fetch('/v1/models/load', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) localError = (await r.json()).error.message;
  refresh();
};
$('btn-unload').onclick = async () => { localError = ''; await fetch('/v1/models/unload', { method: 'POST' }); refresh(); };
$('btn-clear').onclick = () => { history = []; $('chat').innerHTML = ''; };

function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight; return d;
}

async function send() {
  const text = $('prompt').value.trim();
  if (!text || busy) return;
  busy = true; $('btn-send').disabled = true; $('prompt').value = '';
  history.push({ role: 'user', content: text }); addMsg('user', text);
  const out = addMsg('assistant', '');
  let reply = '';
  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, stream: true, max_tokens: Number($('max_tokens').value),
        temperature: Number($('temperature').value), prefix_cache: $('prefix_cache').checked,
        speculative: $('speculative').checked, chat_template_kwargs: { enable_thinking: $('thinking').checked } }),
    });
    if (!resp.ok) { const e = await resp.json(); out.textContent = 'Error: ' + e.error.message; history.pop(); return; }
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim(); if (data === '[DONE]') continue;
        const ev = JSON.parse(data);
        if (ev.error) { reply += `\n[error: ${ev.error.message}]`; }
        const delta = ev.choices && ev.choices[0] && ev.choices[0].delta;
        if (delta && delta.content) reply += delta.content;
        out.textContent = reply; $('chat').scrollTop = $('chat').scrollHeight;
      }
    }
    history.push({ role: 'assistant', content: reply });
  } catch (e) { out.textContent = 'Error: ' + e; history.pop(); }
  finally { busy = false; $('btn-send').disabled = false; refresh(); }
}
$('btn-send').onclick = send;
$('prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

refresh(); refreshModels(); refreshDownloads();
setInterval(refresh, 2000);
</script>
</body>
</html>
